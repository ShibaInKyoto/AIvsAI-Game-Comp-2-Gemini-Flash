name: Build & Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC x64 Native)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DVOIDFALL_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build Executable & Tests
        run: cmake --build build --config Release --parallel

      - name: Run Unit Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Check Standalone Runtime Dependencies
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1
          if ($dumpbin) {
            $deps = & $dumpbin.FullName /dependents build/bin/Release/VoidfallProtocolZero.exe
            $deps
            if ($deps -match "VCRUNTIME|MSVCP") {
              Write-Warning "Binary has dynamic VC runtime dependency; checking static link options"
            }
          }

      - name: Headless Smoke Test with Software OpenGL
        continue-on-error: true
        shell: pwsh
        run: |
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/24.2.8/mesa3d-24.2.8-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          7z x mesa.7z -omesa | Out-Null
          New-Item -ItemType Directory -Force smoke | Out-Null
          Copy-Item build/bin/Release/VoidfallProtocolZero.exe smoke/
          Copy-Item mesa/x64/*.dll smoke/
          $env:GALLIUM_DRIVER = "llvmpipe"
          $p = Start-Process -FilePath smoke/VoidfallProtocolZero.exe -ArgumentList "--windowed","--size","1280x720","--no-audio","--autotest","60","--screenshot","smoke/windows_smoke.png" -PassThru -Wait
          Write-Host "Exit code: $($p.ExitCode)"

      - name: Package Windows Release ZIP
        shell: pwsh
        run: |
          $dist = "dist/VoidfallProtocolZero"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build/bin/Release/VoidfallProtocolZero.exe $dist/
          Copy-Item README.md $dist/README.md
          Compress-Archive -Path $dist -DestinationPath dist/Voidfall-Protocol-Zero-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Voidfall-Protocol-Zero-windows-x64
          path: dist/Voidfall-Protocol-Zero-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux (GCC x64) + Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev xvfb mesa-utils

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVOIDFALL_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run Unit Tests
        run: ctest --test-dir build --output-on-failure

      - name: Headless Simulation Smoke Test
        run: |
          mkdir -p smoke
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" \
            ./build/bin/VoidfallProtocolZero --windowed --size 1280x720 --no-audio \
            --autotest 90 --screenshot smoke/linux_smoke.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke-test
          path: smoke/
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: [windows, linux]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Voidfall-Protocol-Zero-windows-x64
          path: dist
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0"
          fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/Voidfall-Protocol-Zero-windows-x64.zip \
            --target "$GITHUB_SHA" \
            --title "Voidfall: Protocol Zero $TAG" \
            --notes "Official competition release of Voidfall: Protocol Zero for Windows 10/11 x64."

  nightly:
    name: Update Rolling Nightly Build
    needs: [windows, linux]
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Voidfall-Protocol-Zero-windows-x64
          path: dist
      - name: Replace Nightly Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly dist/Voidfall-Protocol-Zero-windows-x64.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Voidfall: Protocol Zero (Latest CI Build)" \
            --notes "Nightly development build compiled from commit ${GITHUB_SHA::7}. Extract the zip and run VoidfallProtocolZero.exe."
